{% extends "layout.html" %}

{% block title %}
    Buy
{% endblock %}

{% block main %}
    <form action="/buy" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control w-auto mx-auto" id="symbol" name="symbol" type="text" placeholder="Symbol">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control w-auto mx-auto" id="shares" name="shares" type="number" placeholder="Shares">
        </div>
        <div class="mb-3">
            <button class="btn btn-primary" type="submit">Buy</button>
        </div>
    </form>
{% endblock %}
